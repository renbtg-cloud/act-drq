name: Activation service verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'adapter-springboot/**'
      - 'core/**'
      - 'store-postgres/**'
      - 'adapter-httpjdk/**'
      - 'runtime-rabbit/**'
      - 'provider/**'
      - 'simulator/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/spring-real-integration.yml'
  pull_request:

jobs:
  postgres-delivery-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: james_ci
          POSTGRES_USER: james_ci
          POSTGRES_PASSWORD: lab-ci-only-unsafe-not-for-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U james_ci -d james_ci"
          --health-interval 3s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: adapter-springboot/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client and provider dependencies
        run: |
          for source_file in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ -f "$source_file" ]] && sudo grep -Fq 'packages.microsoft.com' "$source_file"; then
              sudo mv -- "$source_file" "$source_file.disabled"
            fi
          done
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y postgresql-client
          python3 -m pip install 'cryptography>=42,<50' 'PyYAML>=6,<7'
      - name: Real PostgreSQL-only activation and 4-JVM input simulation
        env:
          JAMES_PG_HOST: 127.0.0.1
          JAMES_PG_PORT: '5432'
          JAMES_PG_DB: james_ci
          JAMES_PG_USER: james_ci
          JAMES_PG_PASSWORD: lab-ci-only-unsafe-not-for-production
          ACTIVATION_DELIVERY_BACKEND: postgres
          ACTIVATION_PG_WORKERS: '4'
          ACTIVATION_RABBIT_PORT: '1'
        run: |
          mvn -B -ntp -f adapter-springboot/pom.xml clean package
          python3 -u tests/run_spring_live_acceptance.py --mode boot --load-jvms 4 --output "$RUNNER_TEMP/postgres-delivery.json"
          python3 - "$RUNNER_TEMP/postgres-delivery.json" <<'PYCI'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('delivery_backend') == 'postgres'
          checks=d.get('tests',[])
          assert len(checks) >= 24 and d.get('failed') == 0 and all(x.get('passed') for x in checks)
          assert d.get('engine_completed') and d.get('flyway_runtime_verified')
          assert d.get('simulator',{}).get('outcome') == 'PASS'
          print('POSTGRES_DELIVERY_PASS',len(checks))
          PYCI

  activation-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [activation, same-row-contention, exact-fault-windows, jwt-security, oidc-keycloak]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: james_ci
          POSTGRES_USER: james_ci
          POSTGRES_PASSWORD: lab-ci-only-unsafe-not-for-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U james_ci -d james_ci"
          --health-interval 3s --health-timeout 5s --health-retries 30
      rabbitmq:
        image: rabbitmq:4.4.0-management
        env:
          RABBITMQ_DEFAULT_USER: james_ci
          RABBITMQ_DEFAULT_PASS: lab-ci-only-rabbit-password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: adapter-springboot/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client and provider libraries
        run: |
          for source_file in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ -f "$source_file" ]] && sudo grep -Fq 'packages.microsoft.com' "$source_file"; then
              sudo mv -- "$source_file" "$source_file.disabled"
            fi
          done
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y postgresql-client
          python3 -m pip install 'cryptography>=42,<50' 'pika==1.3.2' 'PyYAML>=6,<7'
      - name: Real Spring Boot integration — ${{ matrix.scenario }}
        env:
          JAMES_PSQL: psql
          JAMES_PG_HOST: 127.0.0.1
          JAMES_PG_PORT: '5432'
          JAMES_PG_DB: james_ci
          JAMES_PG_USER: james_ci
          JAMES_PG_PASSWORD: lab-ci-only-unsafe-not-for-production
          ACTIVATION_RABBIT_HOST: 127.0.0.1
          ACTIVATION_RABBIT_PORT: '5672'
          ACTIVATION_RABBIT_USER: james_ci
          ACTIVATION_RABBIT_PASSWORD: lab-ci-only-rabbit-password
        run: |
          mvn -B -ntp -f adapter-springboot/pom.xml clean package
          JAR=adapter-springboot/target/james-springboot-0.10.0-SNAPSHOT.jar
          case "${{ matrix.scenario }}" in
            activation)
              python3 -u tests/run_spring_live_acceptance.py --mode boot --load-jvms 4 --boot-jar "$JAR" --output "$RUNNER_TEMP/activation.json"
              python3 - "$RUNNER_TEMP/activation.json" <<'PYCI'
          import json,sys
          d=json.load(open(sys.argv[1]))
          checks=d.get('tests',[])
          assert len(checks)>=20 and all(x.get('passed') is True for x in checks)
          assert d.get('failed')==0 and d.get('passed')==d.get('total')==len(checks)
          assert d.get('exit_code')==0 and d.get('mode')=='boot'
          assert d.get('engine_completed') is True and d.get('flyway_runtime_verified') is True
          assert d.get('simulator',{}).get('outcome')=='PASS'
          print('ACTIVATION_EVIDENCE_PASS',len(checks))
          PYCI
              ;;
            same-row-contention)
              python3 -u tests/run_spring_same_row_race.py --boot-jar "$JAR" --output "$RUNNER_TEMP/spring-same-row-race.json"
              python3 scripts/ci_evidence_gate.py --scenario same-row-contention --result-dir "$RUNNER_TEMP"
              ;;
            exact-fault-windows)
              python3 -u tests/run_spring_fault_windows.py --boot-jar "$JAR" --output "$RUNNER_TEMP/spring-fault-windows.json"
              python3 scripts/ci_evidence_gate.py --scenario exact-fault-windows --result-dir "$RUNNER_TEMP"
              ;;
            jwt-security)
              python3 -m unittest discover -s tests -p test_jwks_rotation_fixture.py -v
              python3 -m unittest discover -s tests -p test_jwt_adversarial_vectors.py -v
              python3 -u tests/run_spring_jwt_security.py --boot-jar "$JAR" --output "$RUNNER_TEMP/spring-jwt-security.json"
              python3 scripts/ci_evidence_gate.py --scenario jwt-security --result-dir "$RUNNER_TEMP"
              ;;
            oidc-keycloak)
              python3 -u tests/run_spring_keycloak_oidc.py --boot-jar "$JAR" --output "$RUNNER_TEMP/spring-keycloak-oidc.json"
              python3 scripts/ci_evidence_gate.py --scenario oidc-keycloak --result-dir "$RUNNER_TEMP"
              ;;
          esac

  simulator-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run simulator's functional and multi-JVM contract tests
        run: |
          python3 -m pip install 'PyYAML>=6,<7' 'cryptography>=42,<50'
          python3 -m unittest discover -s simulator/tests -v
          python3 -m unittest discover -s tests -p test_ci_evidence_gate.py -v
